[project]
name = "todoapp"
version = "0.0.1"
description = "FastAPI Todo App starter project"
readme = "README.md"
authors = [
    { name = "Marcos Vinícius Nunes", email = "imarcosvinicius@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
todoapp = "todoapp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
